# Monokai Pro Ristretto. Single source of truth for theme colors.
# Used by: alacritty, herdr, .zshrc (vi-mode cursor/highlight), tmux status bar.
# nvim uses the monokai-ristretto colorscheme; rofi uses the system Monokai theme.

[palette]
# base
background = "#2c2525"
foreground = "#fff1f3"
cursor = "#c3b7b8"
selection = "#5b5353"
dimmed = "#72696a"

# darker surfaces (herdr, tmux)
surface_dim = "#191515"
sidebar_bg = "#211c1c"
active_row_bg = "#403838"

# accents
red = "#fd6883"
green = "#adda78"
yellow = "#f9cc6c"
orange = "#f38d70" # sits in the ANSI "blue" slot
purple = "#a8a9eb" # sits in the ANSI "magenta" slot
cyan = "#85dacc"
