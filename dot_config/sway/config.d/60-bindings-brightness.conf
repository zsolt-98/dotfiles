# Laptop brightness keys (ported from Fedora's /usr/share/sway/config.d/60-bindings-brightness.conf).
# Only deployed on non-Fedora systems (see .chezmoiignore); Fedora ships this drop-in itself.
#
# Requires: brightnessctl

bindsym XF86MonBrightnessDown exec brightnessctl -q set 5%-
bindsym XF86MonBrightnessUp exec brightnessctl -q set +5%
