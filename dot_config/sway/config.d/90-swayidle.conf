# Overrides /usr/share/sway/config.d/90-swayidle.conf
#
# No automatic lock on idle. Screen locks only on manual request
# (`loginctl lock-session` or `swaylock`) and before sleep.
# No idle display power-off while unlocked; displays power off only after
# $screen_timeout seconds idle while locked.

exec ST="$screen_timeout" ST=${ST:-60} && \
    swayidle -w \
        timeout $ST 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power off"' \
             resume 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power on"'  \
        before-sleep 'swaylock -f' \
        lock 'swaylock -f' \
        unlock 'pkill -xu "$USER" -SIGUSR1 swaylock'
